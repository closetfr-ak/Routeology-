<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dispatch System</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#e2e8f0;
}

/* MOBILE MENU BUTTON */
.menu-toggle{
  display:none;
  position:fixed;
  top:15px;
  left:15px;
  z-index:2000;
  background:#38bdf8;
  color:white;
  border:none;
  padding:12px 14px;
  border-radius:10px;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:230px;
  height:100vh;
  background:#111827;
  padding:20px;
  overflow-y:auto;
  z-index:1500;
}

/* NAV BUTTONS */
.nav-btn{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  background:#1f2937;
  border:none;
  color:white;
  text-align:left;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  transition:.2s ease;
}

.nav-btn:hover{
  background:#334155;
}

/* MAIN CONTENT */
.main{
  margin-left:230px;
  min-height:100vh;
  padding:20px;
}

/* CARDS */
.card{
  background:#1f2937;
  padding:18px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
  font-size:15px;
}

/* BUTTONS */
button.action{
  background:#38bdf8;
  color:white;
  border:none;
  padding:12px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s ease;
}

button.action:hover{
  opacity:.9;
}

/* TABLES */
table{
  width:100%;
  border-collapse:collapse;
}

td, th{
  padding:12px 8px;
  border-bottom:1px solid #334155;
  text-align:left;
}

/* HIDDEN SECTIONS */
.hidden{
  display:none;
}

/* SMALL ACTION BUTTONS */
table button{
  margin-right:6px;
  margin-top:4px;
  padding:7px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#334155;
  color:white;
}

/* MOBILE */
@media (max-width:768px){

  .menu-toggle{
    display:block;
  }

  .sidebar{
    left:-250px;
    transition:.3s ease;
    width:230px;
    padding-top:70px;
  }

  .sidebar.active{
    left:0;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:70px 15px 20px;
  }

  .card{
    padding:15px;
  }

  td, th{
    font-size:14px;
    padding:10px 6px;
  }

  table button{
    display:block;
    width:100%;
    margin-bottom:6px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<button class="menu-toggle" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
  <button class="nav-btn" onclick="show('dashboard')">Dashboard</button>
  <button class="nav-btn" onclick="show('routes')">Routes 🗺️</button>
  <button class="nav-btn" onclick="show('loads')">Loads 🚚</button>
  <button class="nav-btn" onclick="show('drivers')">Drivers 👤</button>
  <button class="nav-btn" onclick="show('fuel')">Fuel ⛽</button>
  <button class="nav-btn" onclick="show('earnings')">Earnings 💰</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="card">
    <h2>Dispatch Overview</h2>
    <p>Loads: <span id="tLoads">0</span></p>
    <p>Drivers: <span id="tDrivers">0</span></p>
    <p>Fuel Cost: $<span id="tFuel">0</span></p>
    <p>Net Profit: $<span id="tEarn">0</span></p>
  </div>
</div>

<!-- ROUTES -->
<div id="routes" class="hidden">
  <div class="card">
    <h3>Create Route</h3>

    <input id="origin" placeholder="Origin"/>
    <input id="destination" placeholder="Destination"/>
    <input id="routeMiles" type="number" placeholder="Miles"/>
    <input id="rate" type="number" placeholder="Rate"/>
    <input id="notes" placeholder="Notes"/>

    <button class="action" onclick="addRoute()">Save Route</button>
  </div>

  <div class="card">
    <h3>Route Board</h3>
    <table>
      <tbody id="routeTable"></tbody>
    </table>
  </div>
</div>

<!-- LOADS -->
<div id="loads" class="hidden">
  <div class="card">
    <h3>Add Load</h3>

    <input id="loadName" placeholder="Load Name"/>
    <input id="loadPay" type="number" placeholder="Pay"/>
    <input id="loadMiles" type="number" placeholder="Miles"/>

    <button class="action" onclick="addLoad()">Save Load</button>
  </div>

  <div class="card">
    <table>
      <tbody id="loadTable"></tbody>
    </table>
  </div>
</div>

<!-- DRIVERS -->
<div id="drivers" class="hidden">
  <div class="card">
    <h3>Add Driver</h3>
    <input id="driverName" placeholder="Driver Name"/>
    <button class="action" onclick="addDriver()">Add Driver</button>
  </div>

  <div class="card">
    <ul id="driverList"></ul>
  </div>
</div>

<!-- FUEL -->
<div id="fuel" class="hidden">
  <div class="card">
    <h3>Add Fuel</h3>

    <input id="gallons" type="number" placeholder="Gallons"/>
    <input id="price" type="number" placeholder="Cost"/>
    <input id="odometer" type="number" placeholder="Odometer"/>

    <button class="action" onclick="addFuel()">Save Fuel</button>
  </div>
</div>

<!-- EARNINGS -->
<div id="earnings" class="hidden">
  <div class="card">
    <h2>Profit Report</h2>
    <p>Revenue: $<span id="rev">0</span></p>
    <p>Fuel Cost: $<span id="fuelCost">0</span></p>
    <p>Net: $<span id="net">0</span></p>
    <p>CPM: $<span id="cpm">0</span></p>
  </div>
</div>

</div>

<script>

/* DATA */
let routes = JSON.parse(localStorage.getItem("routes")) || [];
let loads = JSON.parse(localStorage.getItem("loads")) || [];
let drivers = JSON.parse(localStorage.getItem("drivers")) || [];
let fuel = JSON.parse(localStorage.getItem("fuel")) || [];

/* NAV */
function show(tab){
  ["dashboard","routes","loads","drivers","fuel","earnings"].forEach(t=>{
    document.getElementById(t).classList.add("hidden");
  });
  document.getElementById(tab).classList.remove("hidden");
  updateAll();
}

function toggleSidebar(){
  document.getElementById("sidebar")
    .classList.toggle("active");
}

/* ROUTES */
function addRoute(){

  const originInput = document.getElementById("origin");
  const destinationInput = document.getElementById("destination");
  const milesInput = document.getElementById("routeMiles");
  const rateInput = document.getElementById("rate");
  const notesInput = document.getElementById("notes");

  routes.push({
    origin: originInput.value,
    destination: destinationInput.value,
    miles: Number(milesInput.value),
    rate: Number(rateInput.value),
    notes: notesInput.value
  });

  localStorage.setItem("routes", JSON.stringify(routes));

  renderRoutes();
  updateAll();
}

function renderRoutes(){
  routeTable.innerHTML = routes.map((r,i)=>`
    <tr>
      <td>${r.origin} → ${r.destination}</td>
      <td>${r.miles}</td>
      <td>$${r.rate}</td>
      <td>
        <button onclick="saveRouteAsLoad(${i})">Load</button>
        <button onclick="openMap(${i})">Map</button>
        <button onclick="deleteRoute(${i})">Delete</button>
      </td>
    </tr>
  `).join("");
}

function deleteRoute(i){

  if (!confirm("Delete this route?")) return;

  routes.splice(i, 1);

  localStorage.setItem("routes", JSON.stringify(routes));

  renderRoutes();
  updateAll();
}

/* ROUTE → LOAD */
function saveRouteAsLoad(i){

  const r = routes[i];

  if (!r) {
    alert("Route not found");
    return;
  }

  loads.push({
    name: `${r.origin || "Unknown"} → ${r.destination || "Unknown"}`,
    pay: Number(r.rate || 0),
    miles: Number(r.miles || 0)
  });

  localStorage.setItem("loads", JSON.stringify(loads));

  renderLoads();
  updateAll();

  alert("Saved to Loads");
}

/* MAP */
function openMap(i){
  const r = routes[i];
  window.open(
    `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(r.origin)}&destination=${encodeURIComponent(r.destination)}`
  );
}

/* LOADS */
function addLoad(){
  loads.push({
    name: loadName.value,
    pay: Number(loadPay.value),
    miles: Number(loadMiles.value)
  });

  localStorage.setItem("loads", JSON.stringify(loads));
  renderLoads();
  updateAll();
}

function renderLoads(){
  loadTable.innerHTML = loads.map(l=>
    `<tr><td>${l.name}</td><td>$${l.pay}</td><td>${l.miles}</td></tr>`
  ).join("");
}

/* DRIVERS */
function addDriver(){
  drivers.push(driverName.value);
  localStorage.setItem("drivers", JSON.stringify(drivers));
  renderDrivers();
}

function renderDrivers(){
  driverList.innerHTML = drivers.map(d=>`<li>${d}</li>`).join("");
}

/* FUEL */
function addFuel(){
  fuel.push({
    gallons: Number(gallons.value),
    price: Number(price.value),
    odo: Number(odometer.value)
  });

  localStorage.setItem("fuel", JSON.stringify(fuel));
  updateAll();
}

/* EARNINGS */
function updateAll(){

  let revenue = loads.reduce((a,b)=>a+b.pay,0);
  let fuelCost = fuel.reduce((a,b)=>a+b.price,0);
  let miles = loads.reduce((a,b)=>a+b.miles,0);

  let net = revenue - fuelCost;
  let cpm = miles ? fuelCost / miles : 0;

  tLoads.innerText = loads.length;
  tDrivers.innerText = drivers.length;
  tFuel.innerText = fuelCost.toFixed(2);
  tEarn.innerText = net.toFixed(2);

  rev.innerText = revenue.toFixed(2);
  document.getElementById("fuelCost").innerText = fuelCost.toFixed(2);
  net.innerText = net.toFixed(2);
  cpm.innerText = cpm.toFixed(2);
}

/* INIT */
renderRoutes();
renderLoads();
renderDrivers();
updateAll();

</script>

</body>
</html>
