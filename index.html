
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dispatch System</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
}

.sidebar {
  width: 220px;
  background: #111827;
  height: 100vh;
  padding: 20px;
}

.nav-btn {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  background: #1f2937;
  border: none;
  color: white;
  text-align: left;
  border-radius: 8px;
  cursor: pointer;
}

.nav-btn:hover { background: #334155; }

.main { flex: 1; padding: 20px; }

.card {
  background: #1f2937;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 8px;
  margin: 5px 0 10px;
  border-radius: 6px;
  border: none;
}

button.action {
  background: #38bdf8;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.hidden { display: none; }

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  padding: 8px;
  border-bottom: 1px solid #334155;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Dispatch</h2>

  <button class="nav-btn" onclick="show('dashboard')">Dashboard</button>
  <button class="nav-btn" onclick="show('loads')">Loads 🚚</button>
  <button class="nav-btn" onclick="show('drivers')">Drivers 👤</button>
  <button class="nav-btn" onclick="show('fuel')">Fuel ⛽</button>
  <button class="nav-btn" onclick="show('earnings')">Earnings 💰</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="card">
    <h2>System Overview</h2>
    <p>Active Loads: <span id="tLoads">0</span></p>
    <p>Drivers: <span id="tDrivers">0</span></p>
    <p>Total Fuel Cost: $<span id="tFuel">0</span></p>
    <p>Net Earnings: $<span id="tEarn">0</span></p>
  </div>
</div>

<!-- LOADS -->
<div id="loads" class="hidden">
  <div class="card">
    <h3>Add Load</h3>
    <input id="loadName" placeholder="Load Name"/>
    <input id="loadPay" type="number" placeholder="Pay ($)"/>
    <input id="loadMiles" type="number" placeholder="Miles"/>
    <button class="action" onclick="addLoad()">Add Load</button>
  </div>

  <div class="card">
    <h3>Load Board</h3>
    <table>
      <thead><tr><th>Name</th><th>Pay</th><th>Miles</th></tr></thead>
      <tbody id="loadTable"></tbody>
    </table>
  </div>
</div>

<!-- DRIVERS -->
<div id="drivers" class="hidden">
  <div class="card">
    <h3>Add Driver</h3>
    <input id="driverName" placeholder="Driver Name"/>
    <button class="action" onclick="addDriver()">Add Driver</button>
  </div>

  <div class="card">
    <h3>Driver List</h3>
    <ul id="driverList"></ul>
  </div>
</div>

<!-- FUEL -->
<div id="fuel" class="hidden">
  <div class="card">
    <h3>Add Fuel</h3>
    <input id="gallons" type="number" placeholder="Gallons"/>
    <input id="price" type="number" placeholder="Cost"/>
    <input id="odometer" type="number" placeholder="Odometer"/>
    <button class="action" onclick="addFuel()">Save Fuel</button>
  </div>

  <div class="card">
    <h3>Fuel Log</h3>
    <table>
      <tbody id="fuelTable"></tbody>
    </table>
  </div>
</div>

<!-- EARNINGS -->
<div id="earnings" class="hidden">
  <div class="card">
    <h2>Profit Breakdown</h2>
    <p>Total Revenue: $<span id="rev">0</span></p>
    <p>Total Fuel Cost: $<span id="fuelCost">0</span></p>
    <p>Net Profit: $<span id="net">0</span></p>
    <p>Cost Per Mile: $<span id="cpm">0</span></p>
  </div>
</div>

</div>

<script>

/* STORAGE */
let loads = JSON.parse(localStorage.getItem("loads")) || [];
let drivers = JSON.parse(localStorage.getItem("drivers")) || [];
let fuel = JSON.parse(localStorage.getItem("fuel")) || [];

/* NAV */
function show(tab){
  ["dashboard","loads","drivers","fuel","earnings"].forEach(t=>{
    document.getElementById(t).classList.add("hidden");
  });
  document.getElementById(tab).classList.remove("hidden");

  updateAll();
}

/* LOADS */
function addLoad(){
  loads.push({
    name: loadName.value,
    pay: Number(loadPay.value),
    miles: Number(loadMiles.value)
  });

  localStorage.setItem("loads", JSON.stringify(loads));
  renderLoads();
  updateAll();
}

function renderLoads(){
  loadTable.innerHTML = loads.map(l=>
    `<tr><td>${l.name}</td><td>$${l.pay}</td><td>${l.miles}</td></tr>`
  ).join("");
}

/* DRIVERS */
function addDriver(){
  drivers.push(driverName.value);
  localStorage.setItem("drivers", JSON.stringify(drivers));
  renderDrivers();
  updateAll();
}

function renderDrivers(){
  driverList.innerHTML = drivers.map(d=>`<li>${d}</li>`).join("");
}

/* FUEL */
function addFuel(){
  fuel.push({
    gallons: Number(gallons.value),
    price: Number(price.value),
    odo: Number(odometer.value)
  });

  localStorage.setItem("fuel", JSON.stringify(fuel));
  renderFuel();
  updateAll();
}

function renderFuel(){
  fuelTable.innerHTML = fuel.map(f=>
    `<tr><td>${f.gallons} gal</td><td>$${f.price}</td><td>${f.odo}</td></tr>`
  ).join("");
}

/* CALCULATIONS */
function updateAll(){

  let revenue = loads.reduce((a,b)=>a+b.pay,0);
  let fuelCost = fuel.reduce((a,b)=>a+b.price,0);

  let miles = loads.reduce((a,b)=>a+b.miles,0);

  let net = revenue - fuelCost;
  let cpm = miles ? fuelCost / miles : 0;

  /* dashboard */
  tLoads.innerText = loads.length;
  tDrivers.innerText = drivers.length;
  tFuel.innerText = fuelCost.toFixed(2);
  tEarn.innerText = net.toFixed(2);

  /* earnings page */
  rev.innerText = revenue.toFixed(2);
  fuelCostEl = document.getElementById("fuelCost");
  fuelCostEl.innerText = fuelCost.toFixed(2);
  netEl = document.getElementById("net");
  netEl.innerText = net.toFixed(2);
  cpmEl = document.getElementById("cpm");
  cpmEl.innerText = cpm.toFixed(2);
}

/* INIT */
renderLoads();
renderDrivers();
renderFuel();
updateAll();

</script>

</body>
</html>
